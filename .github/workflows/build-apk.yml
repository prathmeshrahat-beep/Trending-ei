name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Web Application
        run: |
          npm ci
          npm run build
          mkdir -p app/src/main/assets/dist
          cp -r dist/* app/src/main/assets/dist/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Running java -version..."
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Raw Java version string: $JAVA_VERSION_OUTPUT"
          
          # Detect active Java major version
          MAJOR_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not detect Java major version."
            exit 1
          fi
          
          echo "Active Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version is $MAJOR_VERSION, which is lower than 17."
            exit 1
          fi
          echo "Java environment verified: Java $MAJOR_VERSION is active (17 or newer)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "./debug.keystore is missing. Generating temporary debug keystore with keytool..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::warning::Expected debug APK not found at $EXPECTED_APK. Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            fi
            echo "::error::Expected debug APK does not exist at $EXPECTED_APK."
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::$EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::$EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          echo "APK verification confirmed: $EXPECTED_APK exists, is a regular non-empty file with .apk extension."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          echo "Created runner temporary directory: $TEMP_RELEASE_DIR"
          
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(basename "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          RUN_NUMBER="${{ github.run_number }}"
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"
          
          # Copy verified APK into temporary directory without modifying original
          cp app/build/outputs/apk/debug/app-debug.apk "$TARGET_ASSET_PATH"
          
          if [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "::error::Copied release asset is missing or empty: $TARGET_ASSET_PATH"
            exit 1
          fi
          
          echo "release_asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "release_asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version
          
          ASSET_FILE="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "::error::Release asset file $ASSET_FILE does not exist. Aborting release creation."
            exit 1
          fi

          if [ ! -s "$ASSET_FILE" ]; then
            echo "::error::Release asset file $ASSET_FILE is empty. Aborting release creation."
            exit 1
          fi

          case "$ASSET_FILE" in
            *.apk) ;;
            *)
              echo "::error::Release asset does not have .apk extension. Aborting."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat << 'EOF'
This is an automatically generated debug APK.
The APK was built by GitHub Actions.
- GitHub Actions run number: ${{ github.run_number }}
- GitHub Actions run attempt: ${{ github.run_attempt }}
- Source commit SHA: ${{ github.sha }}

The APK is intended for testing.
The APK is not a Play Store production release.
The APK is signed only with a temporary debug keystore.
EOF
)

          echo "Publishing GitHub Release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.release_asset_filename }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== RELEASE SUCCESS CONFIRMATION ==="
            gh release view "$RELEASE_TAG"
            
            RELEASE_PAGE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct GitHub Release page URL: $RELEASE_PAGE_URL"
            echo "Exact APK asset filename: $ASSET_NAME"
            
            echo "### 📱 Android Debug APK Release" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Title:** $RELEASE_TITLE" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page URL:** [$RELEASE_PAGE_URL]($RELEASE_PAGE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Asset Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK can be downloaded directly from the **Assets** section of the release page on your phone." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact named \`app-debug-apk\` is also available as a backup under this run's Artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing was not completed."
            echo "The APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."
            
            echo "### ⚠️ Android Debug APK Build Status" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Build:** Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHub Release Publishing:** Notice: GitHub Release step did not complete (e.g. repository permissions), but the APK build succeeded." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup / Direct Download:** The Actions artifact named \`app-debug-apk\` remains fully available for download under the Artifacts section of this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
